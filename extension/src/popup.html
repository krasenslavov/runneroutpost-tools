<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RunnerOutpost - Group Run Tools</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1><span class="mark" aria-hidden="true"></span> RunnerOutpost</h1>
    <div role="tablist" aria-label="Tools">
      <button role="tab" id="t1" aria-controls="p1" aria-selected="true">Schedule</button>
      <button role="tab" id="t2" aria-controls="p2" aria-selected="false">GPX trim</button>
      <button role="tab" id="t3" aria-controls="p3" aria-selected="false">Time zones</button>
    </div>
    <section role="tabpanel" id="p1" aria-labelledby="t1">
      <div class="tool" data-tool="schedule-to-calendar"></div>
    </section>
    <section role="tabpanel" id="p2" aria-labelledby="t2" hidden>
      <div class="tool" data-tool="gpx-privacy-trimmer"></div>
    </section>
    <section role="tabpanel" id="p3" aria-labelledby="t3" hidden>
      <div class="tool" data-tool="meeting-time-planner"></div>
    </section>
    <p class="note">
      Runs on your device. Nothing is sent anywhere.
      <a href="https://blog.runneroutpost.com/tools/" target="_blank" rel="noopener">More tools</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
